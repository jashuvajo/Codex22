name: deploy-render-backend

on:
  push:
    branches:
      - main
      - cursor/nexusquant-platform-9f8a
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/render-backend-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-backend-to-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered successfully"
