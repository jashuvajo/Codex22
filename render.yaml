services:
  - type: web
    name: nexusquant-backend
    env: docker
    plan: starter
    rootDir: backend
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TRADING_MODE
        value: simulator
      - key: REQUIRE_LIVE_UPSTOX_CONNECTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusquant-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexusquant-redis
          property: connectionString
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false

databases:
  - name: nexusquant-postgres
    plan: starter
    postgresMajorVersion: 16

redis:
  - name: nexusquant-redis
    plan: starter
